name: 'Situation Map'

on:
  pull_request:
    paths:
      - 'apps/situation-map/**'
      - '.github/workflows/situation-map.yml'
  push:
    branches: [main]
    paths:
      - 'apps/situation-map/**'
      - '.github/workflows/situation-map.yml'

concurrency:
  group: situation-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'
      - name: Brief API tests
        working-directory: apps/situation-map
        run: npm ci && npm test
