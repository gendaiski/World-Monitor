name: 'AI Port'

on:
  pull_request:
    paths:
      - 'ai-port/**'
      - '.github/workflows/ai-port.yml'
  push:
    branches: [main]
    paths:
      - 'ai-port/**'
      - '.github/workflows/ai-port.yml'

concurrency:
  group: ai-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'
      - name: AI Port unit and mock-upstream tests
        working-directory: ai-port
        run: npm ci && npm test
